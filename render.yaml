services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: LOG_LEVEL
        value: info

databases:
  - name: seat-reservation-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
